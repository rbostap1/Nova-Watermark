<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Watermark</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="watermark" class="watermark-container">
        <img id="watermark-image" src="" alt="Watermark">
    </div>

    <!-- HUD Overlay -->
    <div id="hud-overlay" class="hud-overlay hidden">
        <div class="hud-card">
            <div class="hud-header">
                <div class="hud-title">Watermark Controls</div>
                <button id="hud-close" class="icon-btn" aria-label="Close">✕</button>
            </div>
            <div class="hud-content">
                <div class="hud-row">
                    <button id="toggle-btn" class="primary-btn">Hide Logo (Server Wide)</button>
                    <button id="refresh-btn" class="secondary-btn">Refresh Logo</button>
                    <button id="sync-btn" class="secondary-btn">Sync</button>
                    <button id="local-toggle-btn" class="secondary-btn">Hide (Client Only)</button>
                </div>
                <div class="hud-row">
                    <label class="slider-label" for="opacity-slider">Opacity</label>
                    <input id="opacity-slider" type="range" min="0" max="100" value="80" />
                    <span id="opacity-value">0.80</span>
                </div>
                <div class="hud-row">
                    <button id="save-btn" class="secondary-btn">Save</button>
                    <button id="reset-btn" class="secondary-btn">Reset Defaults</button>
                    <button id="cancel-btn" class="secondary-btn">Cancel</button>
                </div>
                <div class="hud-row" style="font-size: 12px; opacity: 0.7; margin-top: 8px;">
                    Position: <span id="position-display">X: 20, Y: 20</span>
                </div>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
